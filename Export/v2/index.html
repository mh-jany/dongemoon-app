<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" id="meta-theme-color" content="#0b1120">
    <title>دونگمون | تقسیم هوشمند هزینه‌های گروهی</title>
    <style>
        /* فونت لوکال وزیرمتن و متغیرهای پایه طراحی */
        @font-face {
            font-family: 'Vazirmatn';
            src: url('./fonts/Vazirmatn-Light.woff2') format('woff2');
            font-weight: 300;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'Vazirmatn';
            src: url('./fonts/Vazirmatn-Regular.woff2') format('woff2');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'Vazirmatn';
            src: url('./fonts/Vazirmatn-Medium.woff2') format('woff2');
            font-weight: 500;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'Vazirmatn';
            src: url('./fonts/Vazirmatn-SemiBold.woff2') format('woff2');
            font-weight: 600;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'Vazirmatn';
            src: url('./fonts/Vazirmatn-Bold.woff2') format('woff2');
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'Vazirmatn';
            src: url('./fonts/Vazirmatn-ExtraBold.woff2') format('woff2');
            font-weight: 800;
            font-style: normal;
            font-display: swap;
        }

        :root,
        [data-theme="dark"] {
            color-scheme: dark;

            --primary: #6366f1;
            --primary-hover: #818cf8;
            --primary-light: rgba(99, 102, 241, 0.14);
            --primary-border: rgba(129, 140, 248, 0.32);
            --primary-text-strong: #c7d2fe;

            --success: #34d399;
            --success-bg: rgba(16, 185, 129, 0.12);
            --success-border: rgba(52, 211, 153, 0.28);
            --success-text-strong: #a7f3d0;
            --success-badge-bg: rgba(16, 185, 129, 0.2);
            --success-badge-text: #6ee7b7;

            --danger: #fb7185;
            --danger-bg: rgba(244, 63, 94, 0.12);
            --danger-border: rgba(251, 113, 133, 0.28);
            --danger-badge-bg: rgba(244, 63, 94, 0.2);
            --danger-badge-text: #fda4af;

            --warning: #fbbf24;
            --warning-bg: rgba(245, 158, 11, 0.11);
            --warning-border: rgba(251, 191, 36, 0.28);
            --warning-hover: rgba(245, 158, 11, 0.2);

            --bg-body: #0b1120;
            --bg-card: #121b2e;
            --bg-inner: #0e1626;
            --bg-input: #09101d;
            --bg-subtle: #1c2841;
            --bg-subtle-hover: #263554;
            --bg-glass: rgba(11, 17, 32, 0.78);
            --bg-bar-bottom: rgba(15, 23, 42, 0.88);

            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --text-light: #64748b;
            --placeholder-num: #475569;

            --border-color: #24314a;
            --border-subtle: #1b263c;
            --border-dashed: #334155;

            --hero-glow: radial-gradient(ellipse 80% 70% at 50% 0%, rgba(99, 102, 241, 0.18), rgba(109, 40, 217, 0.06) 55%, transparent 80%);

            --toast-bg: #1e293b;
            --toast-text: #f8fafc;
            --toast-border: #334155;

            --space-2: 8px;
            --space-3: 12px;
            --space-4: 16px;
            --space-6: 24px;

            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;

            --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.22);
            --shadow-md: 0 6px 18px rgba(99, 102, 241, 0.28);
        }

        [data-theme="light"] {
            color-scheme: light;

            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --primary-light: #eef2ff;
            --primary-border: #c7d2fe;
            --primary-text-strong: #3730a3;

            --success: #059669;
            --success-bg: #ecfdf5;
            --success-border: #a7f3d0;
            --success-text-strong: #065f46;
            --success-badge-bg: #d1fae5;
            --success-badge-text: #065f46;

            --danger: #e11d48;
            --danger-bg: #fff1f2;
            --danger-border: #fecdd3;
            --danger-badge-bg: #ffe4e6;
            --danger-badge-text: #9f1239;

            --warning: #d97706;
            --warning-bg: #fffbeb;
            --warning-border: #fde68a;
            --warning-hover: #fef3c7;

            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --bg-inner: #f8fafc;
            --bg-input: #ffffff;
            --bg-subtle: #f1f5f9;
            --bg-subtle-hover: #e2e8f0;
            --bg-glass: rgba(248, 250, 252, 0.82);
            --bg-bar-bottom: rgba(255, 255, 255, 0.9);

            --text-main: #0f172a;
            --text-muted: #475569;
            --text-light: #94a3b8;
            --placeholder-num: #cbd5e1;

            --border-color: #e2e8f0;
            --border-subtle: #f1f5f9;
            --border-dashed: #cbd5e1;

            --hero-glow: radial-gradient(ellipse 80% 70% at 50% 0%, rgba(79, 70, 229, 0.11), rgba(109, 40, 217, 0.04) 55%, transparent 80%);

            --toast-bg: #0f172a;
            --toast-text: #ffffff;
            --toast-border: #1e293b;

            --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.04);
            --shadow-md: 0 6px 16px rgba(79, 70, 229, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        ::selection {
            background-color: var(--primary);
            color: #ffffff;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-body);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 99px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-light);
        }

        body {
            font-family: 'Vazirmatn', Tahoma, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            line-height: 1.65;
            min-height: 100vh;
            padding-bottom: calc(104px + env(safe-area-inset-bottom));
            -webkit-font-smoothing: antialiased;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        @media (min-width: 640px) {
            body {
                padding-bottom: 56px;
            }
        }

        button, input {
            font-family: inherit;
        }

        input {
            caret-color: var(--primary);
        }

        :focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: 2px;
        }

        /* بخش معرفی کوتاه و دکمه تغییر تم (بدون هدر جداگانه، هم‌راستا با ستون‌های کارت پایین) */
        .hero-section {
            position: relative;
            background-image: var(--hero-glow);
            padding: calc(20px + env(safe-area-inset-top)) 0 20px;
            text-align: center;
        }

        @media (min-width: 640px) {
            .hero-section {
                padding: 28px 0 24px;
            }
        }

        .hero-inner {
            position: relative;
            max-width: 820px;
            margin: 0 auto;
            padding: 0 max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left));
        }

        @media (min-width: 640px) {
            .hero-inner {
                padding: 0 24px;
            }
        }

        .theme-toggle-btn {
            position: absolute;
            top: 0;
            left: max(16px, env(safe-area-inset-left));
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background-color: var(--bg-subtle);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
        }

        @media (min-width: 640px) {
            .theme-toggle-btn {
                left: 24px;
            }
        }

        .theme-toggle-btn:hover {
            background-color: var(--bg-subtle-hover);
            border-color: var(--primary-border);
        }

        .theme-toggle-btn:active {
            transform: scale(0.95);
        }

        .hero-section h1 {
            font-size: 1.75rem;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: -0.02em;
            margin-bottom: 6px;
            padding: 4px 68px 0;
        }

        @media (min-width: 640px) {
            .hero-section h1 {
                font-size: 2.1rem;
                padding: 2px 76px 0;
            }
        }

        .hero-section p {
            font-size: 0.92rem;
            color: var(--text-muted);
            max-width: 540px;
            margin: 0 auto;
            font-weight: 400;
        }

        /* کانتینر اصلی (بدون مارجین منفی و بدون همپوشانی) */
        .container {
            max-width: 820px;
            margin: 0 auto;
            padding: 0 max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left));
            display: flex;
            flex-direction: column;
            gap: var(--space-6);
        }

        @media (min-width: 640px) {
            .container {
                padding: 0 24px;
            }
        }

        /* کارت‌ها */
        .card {
            background: var(--bg-card);
            border-radius: var(--radius-xl);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
            padding: var(--space-4);
            transition: background-color 0.25s ease, border-color 0.25s ease;
        }

        @media (min-width: 640px) {
            .card {
                padding: var(--space-6);
            }
        }

        .card-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: var(--space-3);
            padding-bottom: var(--space-4);
            margin-bottom: var(--space-4);
            border-bottom: 1px solid var(--border-subtle);
        }

        .card-title-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .title-bar {
            width: 5px;
            height: 22px;
            border-radius: 99px;
            background-color: var(--primary);
            flex-shrink: 0;
        }

        .title-bar.green {
            background-color: var(--success);
        }

        .title-bar.gray {
            background-color: var(--text-light);
        }

        .card-title {
            font-size: 1.08rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .badge-count {
            background-color: var(--primary-light);
            color: var(--primary-text-strong);
            font-size: 0.78rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 99px;
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: var(--space-2);
            flex-wrap: wrap;
        }

        /* ریسپانسیو دکمه‌های کپی در موبایل */
        .header-copy-full {
            width: auto;
        }

        @media (max-width: 639px) {
            .card-header.has-mobile-copy {
                flex-direction: column;
                align-items: stretch;
            }
            .card-header.has-mobile-copy .header-actions,
            .card-header.has-mobile-copy .btn-copy-primary {
                width: 100%;
            }
            .card-header.has-mobile-copy .header-actions {
                display: grid;
                grid-template-columns: auto 1fr;
            }
        }

        /* فیلد اختیاری عنوان بیرون‌رفتن */
        .outing-title-box {
            margin-bottom: var(--space-4);
            background-color: var(--bg-inner);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: var(--space-3);
            display: flex;
            flex-direction: column;
            gap: var(--space-2);
        }

        @media (min-width: 640px) {
            .outing-title-box {
                flex-direction: row;
                align-items: center;
                gap: var(--space-3);
                padding: 12px 14px;
            }
        }

        .outing-title-label {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.84rem;
            font-weight: 700;
            color: var(--text-muted);
            white-space: nowrap;
            flex-shrink: 0;
        }

        .input-outing-title {
            width: 100%;
            min-height: 44px;
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 9px 12px;
            font-size: 16px;
            font-weight: 600;
            color: var(--text-main);
            outline: none;
            transition: border-color 0.15s ease;
        }

        @media (min-width: 640px) {
            .input-outing-title {
                font-size: 0.92rem;
            }
        }

        .input-outing-title:focus {
            border-color: var(--primary);
        }

        .input-outing-title::placeholder {
            color: var(--text-light);
            font-weight: 400;
        }

        /* دکمه‌ها */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            border: 1px solid transparent;
            border-radius: var(--radius-md);
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.18s ease, border-color 0.18s ease, color 0.18s ease, transform 0.15s ease, filter 0.18s ease;
            user-select: none;
            white-space: nowrap;
            flex-shrink: 0;
            min-height: 44px;
        }

        .btn:active:not(:disabled) {
            transform: scale(0.98);
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .btn-sm {
            font-size: 0.82rem;
            padding: 8px 13px;
            min-height: 40px;
            border-radius: 11px;
        }

        @media (max-width: 639px) {
            .btn-sm {
                min-height: 44px;
            }
        }

        .btn-amber {
            background-color: var(--warning-bg);
            color: var(--warning);
            border-color: var(--warning-border);
        }

        .btn-amber:hover {
            background-color: var(--warning-hover);
        }

        .btn-gray {
            background-color: var(--bg-subtle);
            color: var(--text-muted);
        }

        .btn-gray:hover {
            background-color: var(--bg-subtle-hover);
            color: var(--text-main);
        }

        .btn-outline {
            background-color: var(--bg-input);
            color: var(--text-muted);
            border-color: var(--border-color);
        }

        .btn-outline:hover {
            background-color: var(--primary-light);
            color: var(--primary-text-strong);
            border-color: var(--primary-border);
        }

        .btn-outline.active {
            background-color: var(--primary);
            color: #ffffff;
            border-color: var(--primary);
        }

        .btn-primary {
            background-color: var(--primary);
            color: #ffffff;
            box-shadow: var(--shadow-md);
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-success {
            background-color: var(--success);
            color: #052e23;
        }

        [data-theme="light"] .btn-success {
            color: #ffffff;
        }

        .btn-success:hover {
            filter: brightness(1.06);
        }

        .btn.is-copied {
            background-color: var(--success) !important;
            color: #052e23 !important;
            border-color: var(--success) !important;
        }

        [data-theme="light"] .btn.is-copied {
            color: #ffffff !important;
        }

        .btn-icon-danger {
            background: transparent;
            color: var(--danger);
            width: 44px;
            height: 44px;
            min-height: 44px;
            padding: 0;
            border-radius: 11px;
        }

        .btn-icon-danger:hover:not(:disabled) {
            background-color: var(--danger-bg);
        }

        .btn-icon-danger:disabled {
            color: var(--text-light);
        }

        /* راهنمای کوتاه ورودی */
        .input-hint {
            margin-top: var(--space-3);
            padding: 10px 12px;
            border-radius: var(--radius-md);
            background-color: var(--bg-inner);
            border: 1px dashed var(--border-color);
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .input-hint svg {
            color: var(--primary-hover);
            flex-shrink: 0;
        }

        /* لیست افراد */
        .participants-list {
            display: flex;
            flex-direction: column;
            gap: var(--space-3);
        }

        .person-card {
            background-color: var(--bg-inner);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: var(--space-3);
            transition: border-color 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
        }

        .person-card.is-entering {
            animation: slideIn 0.22s ease-out;
        }

        @media (min-width: 640px) {
            .person-card {
                padding: 14px;
            }
        }

        .person-card:focus-within {
            background-color: var(--bg-card);
            border-color: var(--primary);
            box-shadow: 0 2px 12px rgba(99, 102, 241, 0.1);
        }

        /* چیدمان ریسپانسیو ردیف اصلی فرد:
           موبایل: ردیف اول (ایندکس + نام + حذف)، ردیف دوم (مبلغ + دکمه ریز خرج)
           دسکتاپ: یک ردیف مرتب */
        .person-main-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto 44px;
            gap: 10px;
            align-items: center;
        }

        .person-name-group {
            grid-column: 1 / 3;
            grid-row: 1;
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        .person-amount-slot {
            grid-column: 1 / 2;
            grid-row: 2;
            min-width: 0;
            display: flex;
            align-items: center;
        }

        .js-toggle-itemized-btn {
            grid-column: 2 / 4;
            grid-row: 2;
            min-height: 44px;
        }

        .js-remove-person {
            grid-column: 3 / 4;
            grid-row: 1;
            justify-self: end;
        }

        @media (min-width: 640px) {
            .person-main-row {
                display: flex;
                flex-direction: row;
                align-items: center;
                gap: 10px;
            }
            .person-name-group {
                flex: 1 1 0%;
                min-width: 0;
            }
            .person-amount-slot {
                flex: 0 0 230px;
            }
            .js-toggle-itemized-btn {
                min-height: 44px;
                flex-shrink: 0;
            }
            .js-remove-person {
                flex-shrink: 0;
            }
        }

        .person-index {
            width: 30px;
            height: 30px;
            border-radius: 10px;
            background-color: var(--primary);
            color: #ffffff;
            font-size: 0.82rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-variant-numeric: tabular-nums;
        }

        .input-name {
            width: 100%;
            min-height: 44px;
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 11px;
            padding: 9px 12px;
            font-size: 16px;
            font-weight: 700;
            color: var(--text-main);
            outline: none;
            transition: border-color 0.15s ease;
        }

        @media (min-width: 640px) {
            .input-name {
                font-size: 0.95rem;
            }
        }

        .input-name:focus {
            border-color: var(--primary);
        }

        .input-name::placeholder {
            color: var(--text-light);
            font-weight: 500;
        }

        .amount-wrapper {
            position: relative;
            width: 100%;
            min-width: 0;
            display: flex;
            align-items: center;
        }

        .input-amount {
            width: 100%;
            min-height: 44px;
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 11px;
            padding: 9px 12px 9px 50px;
            text-align: left;
            direction: ltr;
            font-size: 16px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            color: var(--text-main);
            outline: none;
            transition: border-color 0.15s ease;
        }

        @media (min-width: 640px) {
            .input-amount {
                font-size: 0.95rem;
            }
        }

        .input-amount:focus {
            border-color: var(--primary);
        }

        .input-amount::placeholder {
            color: var(--placeholder-num);
        }

        .currency-suffix {
            position: absolute;
            left: 12px;
            font-size: 0.74rem;
            font-weight: 500;
            color: var(--text-light);
            pointer-events: none;
            user-select: none;
        }

        /* باکس نمایش جمع زنده در حالت ریز خرج */
        .itemized-total-box {
            width: 100%;
            min-height: 44px;
            min-width: 0;
            background-color: var(--primary-light);
            border: 1px solid var(--primary-border);
            border-radius: 11px;
            padding: 8px 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 4px;
            white-space: nowrap;
            overflow: hidden;
        }

        @media (min-width: 480px) {
            .itemized-total-box {
                padding: 8px 12px;
                gap: 6px;
            }
        }

        .itemized-total-label {
            font-size: 0.74rem;
            color: var(--primary-text-strong);
            font-weight: 600;
            flex-shrink: 0;
        }

        .itemized-total-value {
            font-size: 0.85rem;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            color: var(--primary-text-strong);
            overflow: hidden;
            text-overflow: ellipsis;
        }

        @media (min-width: 480px) {
            .itemized-total-value {
                font-size: 0.9rem;
            }
        }

        .label-mobile {
            display: inline;
        }

        .label-desktop {
            display: none;
        }

        @media (min-width: 480px) {
            .label-mobile {
                display: none;
            }
            .label-desktop {
                display: inline;
            }
        }

        /* بخش کشویی ریز خرج با انیمیشن نرم باز و بسته شدن */
        .itemized-drawer-wrap {
            display: grid;
            grid-template-rows: 0fr;
            opacity: 0;
            transition: grid-template-rows 0.28s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.22s ease;
        }

        .itemized-drawer-wrap.is-open {
            grid-template-rows: 1fr;
            opacity: 1;
        }

        .itemized-drawer-inner {
            overflow: hidden;
        }

        .itemized-drawer {
            margin-top: var(--space-3);
            padding-top: var(--space-3);
            border-top: 1px dashed var(--border-dashed);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .drawer-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            font-size: 0.82rem;
        }

        .drawer-title {
            font-weight: 700;
            color: var(--primary-text-strong);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .link-reset-mode {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: underline;
            text-underline-offset: 4px;
            padding: 4px 6px;
            white-space: nowrap;
        }

        .link-reset-mode:hover {
            color: var(--danger);
        }

        .expense-items-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* ردیف اقلام ریز خرج: در موبایل عنوان در یک خط و مبلغ + حذف در خط بعد */
        .expense-item-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 44px;
            gap: 8px;
            align-items: center;
            animation: slideIn 0.18s ease-out;
        }

        .expense-item-row .input-item-title {
            grid-column: 1 / -1;
        }

        .expense-item-row .amount-wrapper {
            grid-column: 1 / 2;
        }

        .expense-item-row .js-remove-item {
            grid-column: 2 / 3;
        }

        @media (min-width: 640px) {
            .expense-item-row {
                grid-template-columns: minmax(0, 1fr) 210px 44px;
            }
            .expense-item-row .input-item-title {
                grid-column: auto;
            }
            .expense-item-row .amount-wrapper {
                grid-column: auto;
            }
            .expense-item-row .js-remove-item {
                grid-column: auto;
            }
        }

        .input-item-title {
            width: 100%;
            min-width: 0;
            min-height: 44px;
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 8px 12px;
            font-size: 16px;
            color: var(--text-main);
            outline: none;
        }

        @media (min-width: 640px) {
            .input-item-title {
                font-size: 0.88rem;
            }
        }

        .input-item-title:focus {
            border-color: var(--primary);
        }

        .input-item-amount {
            width: 100%;
            min-width: 0;
            min-height: 44px;
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 8px 12px 8px 48px;
            text-align: left;
            direction: ltr;
            font-size: 16px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            color: var(--text-main);
            outline: none;
        }

        @media (min-width: 640px) {
            .input-item-amount {
                font-size: 0.88rem;
            }
        }

        .input-item-amount:focus {
            border-color: var(--primary);
        }

        .btn-add-item {
            align-self: flex-start;
            background-color: var(--primary-light);
            color: var(--primary-text-strong);
            border-color: var(--primary-border);
            font-size: 0.82rem;
            font-weight: 700;
            padding: 8px 14px;
            min-height: 44px;
            border-radius: 10px;
        }

        .btn-add-item:hover {
            filter: brightness(1.08);
        }

        /* نوار اکشن پایین: در موبایل چسبیده به پایین صفحه، در دسکتاپ زیر لیست */
        .form-footer-actions {
            display: flex;
            flex-direction: row;
            gap: 10px;
        }

        @media (max-width: 639px) {
            .form-footer-actions {
                position: fixed;
                bottom: 0;
                left: 0;
                right: 0;
                z-index: 45;
                background-color: var(--bg-bar-bottom);
                backdrop-filter: blur(16px);
                -webkit-backdrop-filter: blur(16px);
                border-top: 1px solid var(--border-color);
                padding: 12px max(16px, env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
                box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.22);
            }
            .form-footer-actions .btn-lg {
                min-width: 0;
                flex-shrink: 1;
                padding: 10px 12px;
                font-size: 0.88rem;
                gap: 6px;
            }
            .btn-add-person {
                flex: 1 1 0%;
            }
            .btn-calculate {
                flex: 1.25 1 0%;
            }
        }

        @media (min-width: 640px) {
            .form-footer-actions {
                margin-top: 22px;
                padding-top: 18px;
                border-top: 1px solid var(--border-subtle);
            }
            .btn-add-person {
                flex: 1;
            }
            .btn-calculate {
                flex: 1.5;
            }
        }

        .btn-lg {
            min-height: 48px;
            padding: 12px 16px;
            font-size: 0.92rem;
            border-radius: 14px;
        }

        @media (min-width: 640px) {
            .btn-lg {
                font-size: 0.96rem;
                padding: 13px 20px;
            }
        }

        /* بخش نتایج */
        .results-wrapper {
            display: flex;
            flex-direction: column;
            gap: var(--space-6);
            animation: slideIn 0.25s ease-out;
        }

        .hidden {
            display: none !important;
        }

        /* گرید آمار خلاصه (هم در موبایل و هم دسکتاپ ۲ ستونه) */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--space-3);
        }

        @media (min-width: 640px) {
            .stats-grid {
                gap: var(--space-4);
            }
        }

        .stat-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-xl);
            padding: 14px;
            box-shadow: var(--shadow-sm);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            min-width: 0;
        }

        @media (min-width: 640px) {
            .stat-card {
                padding: 20px 22px;
            }
        }

        .stat-label {
            font-size: 0.74rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        @media (min-width: 640px) {
            .stat-label {
                font-size: 0.82rem;
            }
        }

        .stat-value {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--text-main);
            font-variant-numeric: tabular-nums;
            line-height: 1.3;
        }

        @media (min-width: 640px) {
            .stat-value {
                font-size: 1.45rem;
            }
        }

        .stat-value.primary {
            color: var(--primary-hover);
        }

        .stat-unit {
            font-size: 0.72rem;
            font-weight: 400;
            color: var(--text-muted);
            margin-right: 3px;
        }

        .stat-icon {
            width: 36px;
            height: 36px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        @media (min-width: 640px) {
            .stat-icon {
                width: 48px;
                height: 48px;
                border-radius: 15px;
            }
        }

        .stat-icon.indigo {
            background-color: var(--primary-light);
            color: var(--primary-hover);
        }

        .stat-icon.emerald {
            background-color: var(--success-bg);
            color: var(--success);
        }

        /* کارت‌های تسویه حساب */
        .settlements-list {
            display: flex;
            flex-direction: column;
            gap: var(--space-3);
        }

        .settlement-empty {
            background-color: var(--success-bg);
            border: 1px solid var(--success-border);
            border-radius: var(--radius-lg);
            padding: 22px;
            text-align: center;
        }

        .settlement-empty-title {
            font-weight: 800;
            color: var(--success-text-strong);
            font-size: 1rem;
            margin-bottom: 4px;
        }

        .settlement-empty-desc {
            font-size: 0.88rem;
            color: var(--success);
        }

        .settlement-single {
            background-color: var(--bg-inner);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 14px 16px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .settlement-multi-group {
            background-color: var(--warning-bg);
            border: 1px solid var(--warning-border);
            border-radius: var(--radius-lg);
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .multi-group-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--warning-border);
        }

        .multi-badge {
            background-color: var(--danger-bg);
            color: var(--danger);
            border: 1px solid var(--danger-border);
            font-size: 0.75rem;
            font-weight: 700;
            padding: 3px 9px;
            border-radius: 8px;
            font-variant-numeric: tabular-nums;
        }

        .multi-sub-item {
            background-color: var(--bg-card);
            border: 1px solid var(--warning-border);
            border-radius: 12px;
            padding: 12px 14px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .settlement-flow {
            display: inline-flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            font-size: 0.94rem;
        }

        .settlement-arrow {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            border-radius: 8px;
            background-color: var(--bg-subtle);
            color: var(--text-muted);
            flex-shrink: 0;
        }

        .text-payer {
            font-weight: 800;
            color: var(--danger);
        }

        .text-receiver {
            font-weight: 800;
            color: var(--success);
        }

        .amount-pill {
            display: inline-flex;
            align-items: center;
            background-color: var(--primary-light);
            color: var(--primary-text-strong);
            border: 1px solid var(--primary-border);
            font-weight: 800;
            font-size: 0.9rem;
            font-variant-numeric: tabular-nums;
            padding: 4px 12px;
            border-radius: 10px;
            white-space: nowrap;
        }

        /* فاکتور جامع */
        .invoice-card {
            background-color: var(--bg-card);
            border: 2px dashed var(--border-dashed);
            border-radius: var(--radius-xl);
            padding: var(--space-4);
        }

        @media (min-width: 640px) {
            .invoice-card {
                padding: 28px;
            }
        }

        .invoice-outing-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 8px;
            background-color: var(--primary-light);
            color: var(--primary-text-strong);
            border: 1px solid var(--primary-border);
            font-size: 0.82rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 9px;
        }

        .invoice-section-block {
            margin-bottom: 22px;
        }

        .invoice-section-block:last-child {
            margin-bottom: 0;
        }

        .invoice-step-title {
            font-size: 0.84rem;
            font-weight: 800;
            color: var(--text-muted);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .step-num {
            width: 22px;
            height: 22px;
            border-radius: 7px;
            background-color: var(--bg-subtle);
            color: var(--text-main);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.76rem;
            font-variant-numeric: tabular-nums;
        }

        .invoice-person-box {
            background-color: var(--bg-inner);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 12px 15px;
            margin-bottom: 8px;
            font-variant-numeric: tabular-nums;
        }

        .invoice-person-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            flex-wrap: wrap;
        }

        .invoice-person-header.with-items {
            padding-bottom: 8px;
            margin-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
        }

        .invoice-items-ul {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 0.85rem;
        }

        .invoice-items-li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: var(--text-muted);
            gap: 8px;
        }

        .invoice-summary-box {
            background-color: var(--primary-light);
            border: 1px solid var(--primary-border);
            border-radius: 14px;
            padding: 15px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            font-size: 0.9rem;
            font-variant-numeric: tabular-nums;
        }

        @media (min-width: 640px) {
            .invoice-summary-box {
                grid-template-columns: 1fr 1fr;
            }
        }

        /* تراز مالی افراد */
        .balances-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }

        @media (min-width: 640px) {
            .balances-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .balance-item {
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            background-color: var(--bg-inner);
            font-variant-numeric: tabular-nums;
        }

        .balance-item.creditor {
            border-color: var(--success-border);
            background-color: var(--success-bg);
        }

        .balance-item.debtor {
            border-color: var(--danger-border);
            background-color: var(--danger-bg);
        }

        .balance-paid {
            font-size: 0.76rem;
            color: var(--text-muted);
            white-space: nowrap;
        }

        .balance-badge {
            font-size: 0.74rem;
            font-weight: 700;
            padding: 4px 9px;
            border-radius: 8px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        @media (min-width: 480px) {
            .balance-paid {
                font-size: 0.78rem;
            }
            .balance-badge {
                font-size: 0.76rem;
                padding: 4px 10px;
            }
        }

        .balance-badge.creditor {
            background-color: var(--success-badge-bg);
            color: var(--success-badge-text);
        }

        .balance-badge.debtor {
            background-color: var(--danger-badge-bg);
            color: var(--danger-badge-text);
        }

        .balance-badge.settled {
            background-color: var(--bg-subtle);
            color: var(--text-muted);
        }

        /* اعلان شناور (Toast) */
        .toast {
            position: fixed;
            bottom: calc(88px + env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%) translateY(16px);
            background-color: var(--toast-bg);
            color: var(--toast-text);
            border: 1px solid var(--toast-border);
            padding: 11px 18px;
            border-radius: 14px;
            font-size: 0.86rem;
            font-weight: 600;
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
            display: flex;
            align-items: center;
            gap: 8px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease, transform 0.25s ease;
            z-index: 9999;
            max-width: calc(100vw - 32px);
        }

        @media (min-width: 640px) {
            .toast {
                bottom: 24px;
            }
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation: none !important;
                transition: none !important;
                scroll-behavior: auto !important;
            }
        }

        @media print {
            :root, [data-theme="dark"], [data-theme="light"] {
                color-scheme: light;
                --bg-body: #ffffff;
                --bg-card: #ffffff;
                --bg-inner: #f8fafc;
                --bg-subtle: #f1f5f9;
                --text-main: #0f172a;
                --text-muted: #475569;
                --border-color: #cbd5e1;
                --border-dashed: #cbd5e1;
                --primary: #4f46e5;
                --primary-light: #eef2ff;
                --primary-border: #c7d2fe;
                --primary-text-strong: #3730a3;
                --success: #059669;
                --success-bg: #ecfdf5;
                --success-border: #a7f3d0;
                --success-text-strong: #065f46;
                --danger: #e11d48;
                --warning-bg: #fffbeb;
                --warning-border: #fde68a;
            }
            body {
                background: #ffffff;
                color: #0f172a;
                padding: 0;
            }
            .top-bar, .hero-section, #input-section, .stats-grid, #settlements-card, #balances-card, .form-footer-actions, .no-print {
                display: none !important;
            }
            .container {
                margin: 0;
                max-width: 100%;
                padding: 0;
            }
            .invoice-card {
                border: 1px solid #cbd5e1;
            }
        }
    </style>
</head>
<body>

    <!-- معرفی کوتاه صفحه به همراه دکمه تغییر تم -->
    <section class="hero-section">
        <div class="hero-inner">
            <button
                type="button"
                id="btn-theme-toggle"
                class="theme-toggle-btn"
                aria-label="تغییر به حالت روز"
                title="تغییر به حالت روز"
            >
                <svg id="theme-icon-svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
                </svg>
            </button>

            <h1>دونگمون</h1>
            <p>ببین کی به کی چقدر بده!</p>
        </div>
    </section>

    <!-- بدنه اصلی -->
    <main class="container">

        <!-- بخش ورود اطلاعات -->
        <section id="input-section" class="card">
            <div class="card-header">
                <div class="card-title-group">
                    <span class="title-bar"></span>
                    <h2 class="card-title">لیست افراد و هزینه‌ها</h2>
                    <span id="participant-count-badge" class="badge-count">۲ نفر</span>
                </div>

                <div class="header-actions">
                    <button type="button" id="btn-sample" class="btn btn-sm btn-amber">
                        <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
                        </svg>
                        مثال تستی
                    </button>
                    <button type="button" id="btn-reset" class="btn btn-sm btn-gray">
                        <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                        </svg>
                        پاک کردن
                    </button>
                </div>
            </div>

            <!-- بخش اختیاری عنوان بیرون رفتن -->
            <div class="outing-title-box">
                <label for="outing-title-input" class="outing-title-label">
                    <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z" />
                    </svg>
                    کجا بودین؟ (اختیاری)
                </label>
                <input
                    type="text"
                    id="outing-title-input"
                    class="input-outing-title"
                    placeholder="مثلاً: کافه جمعه، سفر شمال، شام دورهمی..."
                >
            </div>

            <!-- لیست کارت‌های افراد -->
            <div id="participants-list" class="participants-list"></div>

            <!-- راهنمای کوتاه ورودی -->
            <p class="input-hint">
                <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />

            </p>

            <!-- دکمه‌های پایین فرم (در موبایل چسبان پایین صفحه) -->
            <div class="form-footer-actions no-print">

                    <svg width="19" height="19" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z" />

        <!-- بخش نتایج -->
        <section id="results-section" class="results-wrapper hidden">

            <!-- کارت‌های خلاصه آمار -->
            <div class="stats-grid no-print">
                <div class="stat-card">

                    <div class="stat-icon indigo" aria-hidden="true">
                        <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z" />

                <div class="stat-card">
                    <div>

                        <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M11 3.055A9.001 9.001 0 1020.945 13H11V3.055z" />
                            <path stroke-linecap="round" stroke-linejoin="round" d="M20.488 9H15V3.512A9.025 9.025 0 0120.488 9z" />

            <!-- کارت نحوه تسویه‌حساب -->
            <div id="settlements-card" class="card no-print">

                        <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />

                <div id="settlements-container" class="settlements-list"></div>

            <!-- کارت فاکتور جامع -->
            <div id="invoice-section" class="invoice-card">
                <div class="card-header has-mobile-copy">
                    <div>
                        <h3 class="card-title" style="font-size: 1.12rem;">صورت‌حساب و فاکتور جامع دونگ</h3>
                        <div id="invoice-outing-badge-wrap"></div>
                        <p id="invoice-date" style="font-size: 0.78rem; color: var(--text-muted); margin-top: 4px;"></p>
                    </div>

                    <div class="header-actions no-print">
                        <button type="button" id="btn-download-pdf" class="btn btn-sm btn-gray">
                            <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.1">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                            </svg>

                        </button>
                        <button type="button" id="btn-copy-invoice" class="btn btn-sm btn-success btn-copy-primary">
                            <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />

            <!-- کارت تراز مالی افراد -->
            <div id="balances-card" class="card no-print">
                <div class="card-header">
                    <div class="card-title-group">
                        <span class="title-bar gray"></span>
                        <h3 class="card-title" style="font-size: 1rem;">وضعیت تراز مالی هر نفر</h3>
