    </main>

    <!-- اعلان شناور (Toast) -->
    <div id="toast" class="toast" role="status" aria-live="polite">
        <span id="toast-icon"></span>
        <span id="toast-message"></span>
    </div>

    <script>
        (function () {
            'use strict';

            // وضعیت مرکزی برنامه
            let participants = [
                { id: 1, name: '', isItemized: false, simpleAmount: '', items: [] },
                { id: 2, name: '', isItemized: false, simpleAmount: '', items: [] }
            ];
            let nextPersonId = 3;
            let nextItemId = 101;
            let outingTitle = '';
            let lastGeneratedFullReport = '';
            let lastGeneratedSettlementSummary = '';
            let lastInvoiceData = null;
            let toastTimer = null;
            const copyFeedbackTimers = new WeakMap();

            const persianOrdinals = [
                'اول', 'دوم', 'سوم', 'چهارم', 'پنجم', 'ششم', 'هفتم', 'هشتم', 'نهم', 'دهم',
                'یازدهم', 'دوازدهم', 'سیزدهم', 'چهاردهم', 'پانزدهم', 'شانزدهم', 'هفدهم', 'هجدهم', 'نوزدهم', 'بیستم'
            ];

            const SUN_ICON_PATH = '<path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />';
            const MOON_ICON_PATH = '<path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />';
            const CHECK_ICON_SVG = '<svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.4"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" /></svg>';
            const ARROW_LEFT_SVG = '<svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.4"><path stroke-linecap="round" stroke-linejoin="round" d="M19 12H5m0 0l6-6m-6 6l6 6" /></svg>';

            // --- مدیریت تم (شب به صورت پیش‌فرض) ---

            function applyTheme(theme) {
                const resolved = theme === 'light' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', resolved);

                const metaThemeColor = document.getElementById('meta-theme-color');
                if (metaThemeColor) {
                    metaThemeColor.setAttribute('content', resolved === 'dark' ? '#0b1120' : '#f8fafc');
                }

                try {
                    localStorage.setItem('dongemoon-theme', resolved);
                } catch (e) {
                    // نادیده گرفتن خطای ذخیره‌سازی در حالت خصوصی مرورگر
                }

                const toggleBtn = document.getElementById('btn-theme-toggle');
                const iconSvg = document.getElementById('theme-icon-svg');
                if (resolved === 'dark') {
                    iconSvg.innerHTML = SUN_ICON_PATH;
                    toggleBtn.setAttribute('aria-label', 'تغییر به حالت روز');
                    toggleBtn.setAttribute('title', 'تغییر به حالت روز');
                } else {
                    iconSvg.innerHTML = MOON_ICON_PATH;
                    toggleBtn.setAttribute('aria-label', 'تغییر به حالت شب');
                    toggleBtn.setAttribute('title', 'تغییر به حالت شب');
                }
            }

            function initTheme() {
                let savedTheme = 'dark';
                try {
                    const stored = localStorage.getItem('dongemoon-theme');
                    if (stored === 'light' || stored === 'dark') {
                        savedTheme = stored;
                    }
                } catch (e) {
                    savedTheme = 'dark';
                }
                applyTheme(savedTheme);
            }

            function toggleTheme() {
                const current = document.documentElement.getAttribute('data-theme') || 'dark';
                applyTheme(current === 'dark' ? 'light' : 'dark');
            }

            // --- توابع کمکی تبدیل اعداد و فرمت‌دهی ---

            function toPersianDigits(val) {
                const digits = ['۰', '۱', '۲', '۳', '۴', '۵', '۶', '۷', '۸', '۹'];
                return String(val).replace(/\d/g, d => digits[Number(d)]);
            }

            function toEnglishDigits(str) {
                if (str === null || str === undefined) return '';
                return String(str)
                    .replace(/[۰-۹]/g, d => String('۰۱۲۳۴۵۶۷۸۹'.indexOf(d)))
                    .replace(/[٠-٩]/g, d => String('٠١٢٣٤٥٦٧٨٩'.indexOf(d)));
            }

            function getPlaceholderName(index) {
                if (index < persianOrdinals.length) {
                    return `نفر ${persianOrdinals[index]}`;
                }
                return `نفر ${toPersianDigits(index + 1)}`;
            }

            function escapeHtml(str) {
                if (!str) return '';
                return String(str)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#39;');
            }

            function getPersianTodayDate() {
                try {
                    return new Intl.DateTimeFormat('fa-IR', {
                        year: 'numeric',
                        month: 'long',
                        day: 'numeric'
                    }).format(new Date());
                } catch (err) {
                    return '';
                }
            }

            function getPersianFileDate() {
                try {
                    const parts = new Intl.DateTimeFormat('fa-IR-u-ca-persian-nu-latn', {
                        year: 'numeric',
                        month: '2-digit',
                        day: '2-digit'
                    }).formatToParts(new Date());
                    const y = parts.find(p => p.type === 'year')?.value;
                    const m = parts.find(p => p.type === 'month')?.value;
                    const d = parts.find(p => p.type === 'day')?.value;
                    return (y && m && d) ? `${y}-${m}-${d}` : '';
                } catch (err) {
                    return '';
                }
            }

            // فرمت عدد خالص به رشته سه‌رقمی فارسی (با رند کردن هوشمند اعشارهای ناچیز)
            function formatCurrency(amount) {
                if (!isFinite(amount) || Math.abs(amount) < 0.01) return '۰';
                const rounded = Math.round(amount);
                const parts = Math.abs(rounded).toString().split('.');
                parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
                return toPersianDigits(parts.join('.'));
            }

            // فرمت لحظه‌ای فیلد ورودی هنگام تایپ یا پیست
            function formatInputDisplay(rawVal) {
                const eng = toEnglishDigits(rawVal).replace(/[^0-9]/g, '');
                if (!eng) return '';
                const normalized = eng.replace(/^0+(?=\d)/, '');
                const withCommas = normalized.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
                return toPersianDigits(withCommas);
            }

            // تبدیل متن فرمت‌شده به عدد خالص
            function parseAmount(val) {
                const cleaned = toEnglishDigits(val).replace(/[^0-9]/g, '');
                if (!cleaned) return 0;
                const num = parseInt(cleaned, 10);
                return isNaN(num) || num < 0 ? 0 : num;
            }

            function getPersonTotal(person) {
                if (person.isItemized) {
                    return person.items.reduce((sum, item) => sum + parseAmount(item.amount), 0);
                }
                return parseAmount(person.simpleAmount);
            }

            // نمایش پیام اطلاع‌رسانی به جای alert
            function showToast(message, type = 'info') {
                const toast = document.getElementById('toast');
                const iconEl = document.getElementById('toast-icon');
                const msgEl = document.getElementById('toast-message');

                const icons = {
                    success: '✅',
                    warning: '⚠️',
                    info: 'ℹ️'
                };

                iconEl.textContent = icons[type] || 'ℹ️';
                msgEl.textContent = message;
                toast.classList.add('show');

                if (toastTimer) clearTimeout(toastTimer);
                toastTimer = setTimeout(() => {
                    toast.classList.remove('show');
                }, 2800);
            }

            // --- رندر کارت‌های ورود اطلاعات ---

            const drawerCloseTimers = new WeakMap();

            function buildAmountControlHtml(person, placeholderName) {
                const total = getPersonTotal(person);
                if (person.isItemized) {
                    return `
                        <div class="itemized-total-box" title="مجموع خودکار اقلام ریز خرج">
                            <span class="itemized-total-label"><span class="label-desktop">جمع ریز خرج:</span><span class="label-mobile">جمع:</span></span>
                            <span id="person-total-${person.id}" class="itemized-total-value">${formatCurrency(total)} <small style="font-weight:500;">تومان</small></span>
                        </div>
                    `;
                }
                return `
                    <div class="amount-wrapper">
                        <input
                            type="text"
                            inputmode="numeric"
                            class="input-amount js-simple-amount"
                            data-person-id="${person.id}"
                            value="${escapeHtml(person.simpleAmount)}"
                            placeholder="۰"
                            aria-label="مبلغ هزینه ${placeholderName}"
                        >
                        <span class="currency-suffix">تومان</span>
                    </div>
                `;
            }

            function buildExpenseItemRowHtml(personId, item) {
                return `
                    <div class="expense-item-row" data-item-id="${item.id}">
                        <input
                            type="text"
                            class="input-item-title js-item-title"
                            data-person-id="${personId}"
                            data-item-id="${item.id}"
                            value="${escapeHtml(item.title)}"
                            placeholder="شرح هزینه (مثلاً: ناهار، اسنپ)"
                        >
                        <div class="amount-wrapper">
                            <input
                                type="text"
                                inputmode="numeric"
                                class="input-item-amount js-item-amount"
                                data-person-id="${personId}"
                                data-item-id="${item.id}"
                                value="${escapeHtml(item.amount)}"
                                placeholder="۰"
                            >
                            <span class="currency-suffix">تومان</span>
                        </div>
                        <button
                            type="button"
                            class="btn btn-icon-danger js-remove-item"
                            data-person-id="${personId}"
                            data-item-id="${item.id}"
                            aria-label="حذف این قلم"
                            title="حذف این قلم"
                        >
                            <svg width="17" height="17" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                            </svg>
                        </button>
                    </div>
                `;
            }

            function buildDrawerHtml(person, placeholderName, isOpen = true) {
                const rowsHtml = person.items.map(item => buildExpenseItemRowHtml(person.id, item)).join('');
                const displayName = person.name.trim() ? escapeHtml(person.name.trim()) : placeholderName;
                return `
                    <div class="itemized-drawer-wrap ${isOpen ? 'is-open' : ''}">
                        <div class="itemized-drawer-inner">
                            <div class="itemized-drawer">
                                <div class="drawer-header">
                                    <span class="drawer-title">
                                        <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
                                            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
                                        </svg>
                                        <span>ریز هزینه‌های <span class="js-drawer-person-name">${displayName}</span>:</span>
                                    </span>
                                    <button type="button" class="link-reset-mode js-toggle-itemized" data-person-id="${person.id}">
                                        بازگشت به مبلغ کلی
                                    </button>
                                </div>
                                <div class="expense-items-list">
                                    ${rowsHtml}
                                </div>
                                <button type="button" class="btn btn-add-item js-add-item" data-person-id="${person.id}">
                                    + افزودن هزینه جدید
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }

            function renderParticipants() {
                const listEl = document.getElementById('participants-list');
                const badgeEl = document.getElementById('participant-count-badge');
                badgeEl.textContent = `${toPersianDigits(participants.length)} نفر`;

                const canDelete = participants.length > 2;

                listEl.innerHTML = participants.map((person, index) => {
                    const placeholderName = getPlaceholderName(index);
                    const amountControlHtml = buildAmountControlHtml(person, placeholderName);
                    const drawerHtml = person.isItemized ? buildDrawerHtml(person, placeholderName, true) : '';

                    return `
                        <div class="person-card" data-person-id="${person.id}">
                            <div class="person-main-row">
                                <div class="person-name-group">
                                    <span class="person-index">${toPersianDigits(index + 1)}</span>
                                    <input
                                        type="text"
                                        class="input-name js-person-name"
                                        data-person-id="${person.id}"
                                        value="${escapeHtml(person.name)}"
                                        placeholder="${placeholderName}"
                                        aria-label="نام ${placeholderName}"
                                    >
                                </div>

                                <div class="person-amount-slot">
                                    ${amountControlHtml}
                                </div>

                                <button
                                    type="button"
                                    class="btn btn-sm btn-outline js-toggle-itemized js-toggle-itemized-btn ${person.isItemized ? 'active' : ''}"
                                    data-person-id="${person.id}"
                                    title="${person.isItemized ? 'بازگشت به حالت مبلغ کلی' : 'ثبت ریز خرج برای این فرد'}"
                                >
                                    <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01" />
                                    </svg>
                                    ریز خرج
                                </button>

                                <button
                                    type="button"
                                    class="btn btn-icon-danger js-remove-person"
                                    data-person-id="${person.id}"
                                    ${!canDelete ? 'disabled' : ''}
                                    aria-label="${canDelete ? `حذف ${placeholderName}` : 'حداقل ۲ نفر باید در لیست باشند'}"
                                    title="${canDelete ? 'حذف این نفر' : 'حداقل ۲ نفر باید در لیست باشند'}"
                                >
                                    <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                                    </svg>
                                </button>
                            </div>
                            ${drawerHtml}
                        </div>
                    `;
                }).join('');
            }

            // --- مدیریت رویدادها با Event Delegation (پایدار و بدون خطا) ---

            const outingTitleInput = document.getElementById('outing-title-input');
            outingTitleInput.addEventListener('input', function (e) {
                outingTitle = e.target.value;
            });
            outingTitleInput.addEventListener('keydown', function (e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    calculateDong(true);
                }
            });

            const participantsListEl = document.getElementById('participants-list');

            participantsListEl.addEventListener('input', function (e) {
                const target = e.target;

                if (target.classList.contains('js-person-name')) {
                    const personId = Number(target.dataset.personId);
                    const index = participants.findIndex(p => p.id === personId);
                    if (index !== -1) {
                        participants[index].name = target.value;
                        const card = target.closest('.person-card');
                        const drawerNameEl = card ? card.querySelector('.js-drawer-person-name') : null;
                        if (drawerNameEl) {
                            drawerNameEl.textContent = target.value.trim() || getPlaceholderName(index);
                        }
                    }
                    return;
                }

                if (target.classList.contains('js-simple-amount')) {
                    const personId = Number(target.dataset.personId);
                    const formatted = formatInputDisplay(target.value);
                    target.value = formatted;
                    const person = participants.find(p => p.id === personId);
                    if (person) {
                        person.simpleAmount = formatted;
                    }
                    return;
                }

                if (target.classList.contains('js-item-title')) {
                    const personId = Number(target.dataset.personId);
                    const itemId = Number(target.dataset.itemId);
                    const person = participants.find(p => p.id === personId);
                    if (person) {
                        const item = person.items.find(i => i.id === itemId);
                        if (item) item.title = target.value;
                    }
                    return;
                }

                if (target.classList.contains('js-item-amount')) {
                    const personId = Number(target.dataset.personId);
                    const itemId = Number(target.dataset.itemId);
                    const formatted = formatInputDisplay(target.value);
                    target.value = formatted;

                    const person = participants.find(p => p.id === personId);
                    if (person) {
                        const item = person.items.find(i => i.id === itemId);
                        if (item) item.amount = formatted;

                        const totalEl = document.getElementById(`person-total-${personId}`);
                        if (totalEl) {
                            totalEl.innerHTML = `${formatCurrency(getPersonTotal(person))} <small style="font-weight:500;">تومان</small>`;
                        }
                    }
                }
            });

            participantsListEl.addEventListener('keydown', function (e) {
                if (e.key === 'Enter' && e.target.tagName === 'INPUT') {
                    e.preventDefault();
                    calculateDong(true);
                }
            });

            participantsListEl.addEventListener('click', function (e) {
                const toggleBtn = e.target.closest('.js-toggle-itemized');
                if (toggleBtn) {
                    const personId = Number(toggleBtn.dataset.personId);
                    toggleItemizedMode(personId);
                    return;
                }

                const removePersonBtn = e.target.closest('.js-remove-person');
                if (removePersonBtn && !removePersonBtn.disabled) {
                    const personId = Number(removePersonBtn.dataset.personId);
                    removeParticipant(personId);
                    return;
                }

                const addItemBtn = e.target.closest('.js-add-item');
                if (addItemBtn) {
                    const personId = Number(addItemBtn.dataset.personId);
                    addExpenseItem(personId);
                    return;
                }

                const removeItemBtn = e.target.closest('.js-remove-item');
                if (removeItemBtn) {
                    const personId = Number(removeItemBtn.dataset.personId);
                    const itemId = Number(removeItemBtn.dataset.itemId);
                    removeExpenseItem(personId, itemId);
                }
            });

            // --- عملیات روی افراد و اقلام ---

            function toggleItemizedMode(personId) {
                const index = participants.findIndex(p => p.id === personId);
                if (index === -1) return;
                const person = participants[index];
                const placeholderName = getPlaceholderName(index);

                if (!person.isItemized) {
                    const existingVal = parseAmount(person.simpleAmount);
                    person.isItemized = true;
                    if (person.items.length === 0) {
                        person.items = [
                            {
                                id: nextItemId++,
                                title: '',
                                amount: existingVal > 0 ? person.simpleAmount : ''
                            }
                        ];
                    }
                } else {
                    const totalFromItems = getPersonTotal(person);
                    person.isItemized = false;
                    person.simpleAmount = totalFromItems > 0 ? formatInputDisplay(String(totalFromItems)) : '';
                }

                const card = document.querySelector(`.person-card[data-person-id="${personId}"]`);
                if (!card) {
                    renderParticipants();
                    return;
                }

                // فقط بخش مبلغ و دکمه همین کارت به‌روزرسانی می‌شود (بدون رفرش کل لیست)
                const amountSlot = card.querySelector('.person-amount-slot');
                if (amountSlot) {
                    amountSlot.innerHTML = buildAmountControlHtml(person, placeholderName);
                }

                const toggleBtn = card.querySelector('.js-toggle-itemized-btn');
                if (toggleBtn) {
                    toggleBtn.classList.toggle('active', person.isItemized);
                    toggleBtn.title = person.isItemized ? 'بازگشت به حالت مبلغ کلی' : 'ثبت ریز خرج برای این فرد';
                }

                const prevCloseTimer = drawerCloseTimers.get(card);
                if (prevCloseTimer) {
                    clearTimeout(prevCloseTimer);
                    drawerCloseTimers.delete(card);
                }

                const existingWrap = card.querySelector('.itemized-drawer-wrap');
                if (person.isItemized) {
                    if (existingWrap) existingWrap.remove();
                    card.insertAdjacentHTML('beforeend', buildDrawerHtml(person, placeholderName, false));
                    const newWrap = card.querySelector('.itemized-drawer-wrap');
                    if (newWrap) {
                        void newWrap.offsetHeight;
                        newWrap.classList.add('is-open');
                    }
                } else if (existingWrap) {
                    existingWrap.classList.remove('is-open');
                    const removeAfterClose = () => {
                        if (!person.isItemized && existingWrap.parentNode) {
                            existingWrap.remove();
                        }
                        drawerCloseTimers.delete(card);
                    };
                    existingWrap.addEventListener('transitionend', function onEnd(e) {
                        if (e.propertyName === 'grid-template-rows') {
                            existingWrap.removeEventListener('transitionend', onEnd);
                            removeAfterClose();
                        }
                    });
                    const fallbackTimer = setTimeout(removeAfterClose, 320);
                    drawerCloseTimers.set(card, fallbackTimer);
                }
            }

            function addExpenseItem(personId) {
                const person = participants.find(p => p.id === personId);
                if (!person) return;
                const newItem = {
                    id: nextItemId++,
                    title: '',
                    amount: ''
                };
                person.items.push(newItem);

                const card = document.querySelector(`.person-card[data-person-id="${personId}"]`);
                const itemsList = card ? card.querySelector('.expense-items-list') : null;
                if (!itemsList) {
                    renderParticipants();
                    return;
                }

                itemsList.insertAdjacentHTML('beforeend', buildExpenseItemRowHtml(personId, newItem));
                const newRow = itemsList.querySelector(`.expense-item-row[data-item-id="${newItem.id}"]`);
                const titleInput = newRow ? newRow.querySelector('.js-item-title') : null;
                if (titleInput) titleInput.focus();
            }

            function removeExpenseItem(personId, itemId) {
                const person = participants.find(p => p.id === personId);
                if (!person) return;

                const card = document.querySelector(`.person-card[data-person-id="${personId}"]`);
                if (!card) {
                    if (person.items.length <= 1) {
                        person.items[0].title = '';
                        person.items[0].amount = '';
                    } else {
                        person.items = person.items.filter(i => i.id !== itemId);
                    }
                    renderParticipants();
                    return;
                }

                if (person.items.length <= 1) {
                    person.items[0].title = '';
                    person.items[0].amount = '';
                    const row = card.querySelector(`.expense-item-row[data-item-id="${person.items[0].id}"]`);
                    if (row) {
                        const titleEl = row.querySelector('.js-item-title');
                        const amountEl = row.querySelector('.js-item-amount');
                        if (titleEl) titleEl.value = '';
                        if (amountEl) amountEl.value = '';
                    }
                } else {
                    person.items = person.items.filter(i => i.id !== itemId);
                    const row = card.querySelector(`.expense-item-row[data-item-id="${itemId}"]`);
                    if (row) row.remove();
                }

                const totalEl = document.getElementById(`person-total-${personId}`);
                if (totalEl) {
                    totalEl.innerHTML = `${formatCurrency(getPersonTotal(person))} <small style="font-weight:500;">تومان</small>`;
                }
            }

            function addParticipant() {

            // --- الگوریتم محاسبه دونگ و تسویه‌حساب بدون خطای ممیز شناور ---

            function calculateDong(shouldScroll = true) {
                const count = participants.length;
                if (count < 2) return;

                const processed = participants.map((p, index) => {
                    const cleanName = p.name.trim() || getPlaceholderName(index);

                    if (p.isItemized) {
                        const validItems = p.items
                            .map(item => ({
                                title: item.title.trim() || 'هزینه متفرقه',
                                amount: parseAmount(item.amount)
                            }))
                            .filter(item => item.amount > 0);

                        const paid = validItems.reduce((sum, item) => sum + item.amount, 0);
                        return {
                            id: p.id,
                            name: cleanName,
                            hasItemizedDetails: validItems.length > 0,
                            items: validItems,
                            paid: paid
                        };
                    } else {
                        const paid = parseAmount(p.simpleAmount);
                        return {
                            id: p.id,
                            name: cleanName,
                            hasItemizedDetails: false,
                            items: [],
                            paid: paid
                        };
                    }
                });

                const totalExpense = processed.reduce((sum, p) => sum + p.paid, 0);
                const sharePerPerson = totalExpense / count;

                document.getElementById('total-expense-display').textContent = formatCurrency(totalExpense);
                document.getElementById('per-person-share-display').textContent = formatCurrency(sharePerPerson);

                // محاسبه تراز هر شخص به صورت عدد صحیح رندشده (تومان) برای جلوگیری کامل از خطای ممیز شناور
                const EPSILON = 1;
                const creditors = [];
                const debtors = [];

                const balances = processed.map(p => {
                    const exactNet = p.paid - sharePerPerson;
                    const roundedNet = Math.round(exactNet);

                    if (roundedNet >= EPSILON) {
                        creditors.push({ name: p.name, amount: roundedNet });
                    } else if (roundedNet <= -EPSILON) {
                        debtors.push({ name: p.name, amount: Math.abs(roundedNet) });
                    }

                    return {
                        name: p.name,
                        paid: p.paid,
                        net: roundedNet
                    };
                });

                // مرتب‌سازی نزولی برای کمینه‌سازی تعداد تراکنش‌ها
                creditors.sort((a, b) => b.amount - a.amount);
                debtors.sort((a, b) => b.amount - a.amount);

                const transactions = [];
                let i = 0;
                let j = 0;
                let safetyCounter = 0;

                while (i < debtors.length && j < creditors.length && safetyCounter < 1000) {
                    safetyCounter++;
                    const debtor = debtors[i];
                    const creditor = creditors[j];

                    const transfer = Math.min(debtor.amount, creditor.amount);
                    if (transfer >= EPSILON) {
                        transactions.push({
                            from: debtor.name,
                            to: creditor.name,
                            amount: transfer
                        });
                    }

                    debtor.amount -= transfer;
                    creditor.amount -= transfer;

                    if (debtor.amount < EPSILON) i++;
                    if (creditor.amount < EPSILON) j++;
                }

                const cleanOutingTitle = outingTitle.trim();
                const todayPersian = getPersianTodayDate();

                lastInvoiceData = {
                    processed,
                    totalExpense,
                    sharePerPerson,
                    transactions,
                    cleanOutingTitle,
                    todayPersian
                };

                renderSettlements(transactions, totalExpense);
                renderInvoice(processed, totalExpense, sharePerPerson, transactions, cleanOutingTitle, todayPersian);
                renderBalances(balances);
                buildSettlementSummaryReport(transactions, totalExpense, cleanOutingTitle, todayPersian);
                buildFullTextReport(processed, totalExpense, sharePerPerson, transactions, cleanOutingTitle, todayPersian);

                const resultsSection = document.getElementById('results-section');
                resultsSection.classList.remove('hidden');

                if (shouldScroll) {
                    resultsSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
            }

            // --- رندر کارت‌های تسویه حساب ---

            function renderSettlementRowHtml(t) {
                return `
                    <div class="settlement-flow">
                        <span class="text-payer">${escapeHtml(t.from)}</span>
                        <span class="settlement-arrow" aria-hidden="true">${ARROW_LEFT_SVG}</span>
                        <span class="text-receiver">${escapeHtml(t.to)}</span>
                    </div>
                    <span class="amount-pill">${formatCurrency(t.amount)} تومان</span>
                `;
            }

            function renderSettlements(transactions, totalExpense) {
                const container = document.getElementById('settlements-container');

                if (transactions.length === 0) {
                    const msg = totalExpense === 0
                        ? 'هنوز هیچ هزینه‌ای وارد نشده است!'
                        : 'همه افراد دقیقاً به اندازه سهم خود هزینه کرده‌اند و هیچ‌کس به دیگری بدهکار نیست.';
                    container.innerHTML = `
                        <div class="settlement-empty">
                            <p class="settlement-empty-title">همه بی‌حساب هستند!</p>
                            <p class="settlement-empty-desc">${msg}</p>
                        </div>
                    `;
                    return;
                }

                // گروه‌بندی پرداخت‌ها بر اساس شخص بدهکار (پرداخت‌کننده)
                const groupedByPayer = {};
                transactions.forEach(t => {
                    if (!groupedByPayer[t.from]) {
                        groupedByPayer[t.from] = [];
                    }
                    groupedByPayer[t.from].push(t);
                });

                let html = '';
                Object.entries(groupedByPayer).forEach(([payerName, transfers]) => {
                    if (transfers.length > 1) {
                        const totalDebt = transfers.reduce((s, t) => s + t.amount, 0);
                        html += `
                            <div class="settlement-multi-group">
                                <div class="multi-group-header">
                                    <div style="display:flex; align-items:center; gap:8px;">
                                        <span class="multi-badge">پرداخت به ${toPersianDigits(transfers.length)} نفر</span>
                                        <strong style="font-size:1rem;">${escapeHtml(payerName)}</strong>
                                    </div>
                                    <span style="font-size:0.8rem; color:var(--text-muted); font-variant-numeric:tabular-nums;">
                                        مجموع بدهی: <strong style="color:var(--danger);">${formatCurrency(totalDebt)} تومان</strong>
                                    </span>
                                </div>
                                ${transfers.map(t => `
                                    <div class="multi-sub-item">
                                        ${renderSettlementRowHtml(t)}
                                    </div>
                                `).join('')}
                            </div>
                        `;
                    } else {
                        const t = transfers[0];
                        html += `
                            <div class="settlement-single">
                                ${renderSettlementRowHtml(t)}
                            </div>
                        `;
                    }
                });

                container.innerHTML = html;
            }

            // --- رندر فاکتور جامع ---

            function renderInvoice(processed, totalExpense, sharePerPerson, transactions, cleanOutingTitle, todayPersian) {
                const dateEl = document.getElementById('invoice-date');
                const badgeWrap = document.getElementById('invoice-outing-badge-wrap');
                const bodyEl = document.getElementById('invoice-body');

                const spenders = processed.filter(p => p.paid > 0);
                const nonSpenders = processed.filter(p => p.paid === 0);

                if (spenders.length === 0) {

                } else {

                                <div class="invoice-person-box">

                                        <strong style="font-size:0.95rem;">• ${escapeHtml(person.name)}</strong>
                                        <span class="badge-count">جمع پرداختی: ${formatCurrency(person.paid)} تومان</span>
                                    </div>
                                    <ul class="invoice-items-ul">
                                        ${person.items.map(item => `

                                            </li>
                                        `).join('')}
                                    </ul>
                                </div>
                            `;
                        } else {
                            expensesHtml += `
                                <div class="invoice-person-box">
                                    <div class="invoice-person-header">
                                        <strong style="font-size:0.95rem;">• ${escapeHtml(person.name)}</strong>
                                        <span class="badge-count">مبلغ هزینه: ${formatCurrency(person.paid)} تومان</span>
                                    </div>
                                </div>

            // --- رندر کارت تراز مالی افراد ---

            function renderBalances(balances) {
                const listEl = document.getElementById('balances-list');
                listEl.innerHTML = balances.map(b => {
                    let statusClass = 'settled';
                    let badgeText = 'بی‌حساب';

                    if (b.net > 0) {
                        statusClass = 'creditor';
                        badgeText = `طلبکار: ${formatCurrency(b.net)} تومان`;
                    } else if (b.net < 0) {
                        statusClass = 'debtor';
                        badgeText = `بدهکار: ${formatCurrency(Math.abs(b.net))} تومان`;
                    }

                    return `
                        <div class="balance-item ${statusClass}">
                            <div style="min-width: 0;">
                                <div style="font-weight:700; font-size:0.92rem;">${escapeHtml(b.name)}</div>
                                <div class="balance-paid">پرداختی: ${formatCurrency(b.paid)} تومان</div>
                            </div>
                            <span class="balance-badge ${statusClass}">${badgeText}</span>
                        </div>
                    `;
                }).join('');
            }

            // --- ساخت متن خلاصه تسویه‌حساب (عنوان، تاریخ، مجموع کل هزینه‌ها و نحوه تسویه‌حساب) ---

            function buildSettlementSummaryReport(transactions, totalExpense, cleanOutingTitle, todayPersian) {
                const lines = [];

            function triggerCopyButtonFeedback(btn, customLabel = 'کپی شد') {
                if (!btn) return;
                if (!btn.dataset.originalHtml) {
                    btn.dataset.originalHtml = btn.innerHTML;
                }
                const prevTimer = copyFeedbackTimers.get(btn);
                if (prevTimer) {
                    clearTimeout(prevTimer);
                }

                btn.innerHTML = `${CHECK_ICON_SVG} ${customLabel}`;
                btn.classList.add('is-copied');

                const timer = setTimeout(() => {
                    btn.innerHTML = btn.dataset.originalHtml;
                    btn.classList.remove('is-copied');
                    copyFeedbackTimers.delete(btn);
                }, 1500);
                copyFeedbackTimers.set(btn, timer);
            }

            // --- تولید و دانلود مستقیم فایل PDF فاکتور (بدون باز شدن پنجره پرینت) ---

            function drawRoundRect(ctx, x, y, w, h, r, fillColor, strokeColor, lineWidth = 1.5) {
                const radius = Math.min(r, w / 2, h / 2);
                ctx.beginPath();
                ctx.moveTo(x + radius, y);
                ctx.lineTo(x + w - radius, y);
                ctx.quadraticCurveTo(x + w, y, x + w, y + radius);
                ctx.lineTo(x + w, y + h - radius);
                ctx.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
                ctx.lineTo(x + radius, y + h);
                ctx.quadraticCurveTo(x, y + h, x, y + h - radius);
                ctx.lineTo(x, y + radius);
                ctx.quadraticCurveTo(x, y, x + radius, y);
                ctx.closePath();

                if (fillColor) {
                    ctx.fillStyle = fillColor;
                    ctx.fill();
                }
                if (strokeColor) {
                    ctx.strokeStyle = strokeColor;
                    ctx.lineWidth = lineWidth;
                    ctx.stroke();
                }
            }

            function wrapCanvasText(ctx, text, maxWidth) {
                const words = String(text || '').split(/\s+/).filter(Boolean);
                if (words.length === 0) return [''];
                const lines = [];
                let current = words[0];

                for (let i = 1; i < words.length; i++) {
                    const candidate = current + ' ' + words[i];
                    if (ctx.measureText(candidate).width <= maxWidth) {
                        current = candidate;
                    } else {
                        lines.push(current);
                        current = words[i];
                    }
                }
                lines.push(current);
                return lines;
            }

            function renderInvoiceCanvases(data) {
                const {
                    processed,
                    totalExpense,
                    sharePerPerson,
                    transactions,
                    cleanOutingTitle,
                    todayPersian

                const PAGE_W = 1240;
                const PAGE_H = 1754;
                const MARGIN = 76;
                const CONTENT_W = PAGE_W - MARGIN * 2;
                const RIGHT_X = PAGE_W - MARGIN;
                const LEFT_X = MARGIN;
                const MAX_Y = PAGE_H - 110;
                const FONT_FAMILY = 'Vazirmatn, Tahoma, Arial, sans-serif';

                const pages = [];
                let ctx = null;
                let cursorY = MARGIN;

                function setFont(weight, sizePx) {
                    ctx.font = `${weight} ${sizePx}px ${FONT_FAMILY}`;
                    ctx.direction = 'rtl';
                    ctx.textBaseline = 'middle';
                }

                function createNewPage() {
                    const canvas = document.createElement('canvas');
                    canvas.width = PAGE_W;
                    canvas.height = PAGE_H;
                    ctx = canvas.getContext('2d');
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, PAGE_W, PAGE_H);
                    ctx.direction = 'rtl';
                    ctx.textBaseline = 'middle';
                    pages.push({ canvas, ctx });
                    cursorY = MARGIN;
                }

                function ensureSpace(requiredHeight) {
                    if (cursorY + requiredHeight > MAX_Y) {
                        createNewPage();
                    }
                }

                function drawSectionTitle(stepNum, titleText) {
                    ensureSpace(70);
                    const badgeSize = 36;
                    const badgeX = RIGHT_X - badgeSize;
                    const badgeY = cursorY;

                    drawRoundRect(ctx, badgeX, badgeY, badgeSize, badgeSize, 10, '#eef2ff', '#c7d2fe', 1.2);
                    setFont(800, 20);
                    ctx.fillStyle = '#4338ca';
                    ctx.textAlign = 'center';
                    ctx.fillText(toPersianDigits(stepNum), badgeX + badgeSize / 2, badgeY + badgeSize / 2 + 1);

                    setFont(800, 23);
                    ctx.fillStyle = '#334155';
                    ctx.textAlign = 'right';
                    ctx.fillText(titleText, badgeX - 14, badgeY + badgeSize / 2 + 1);

                    cursorY += badgeSize + 18;
                }

                function drawLeftArrowChip(centerX, centerY) {
                    const chipW = 38;
                    const chipH = 32;
                    drawRoundRect(ctx, centerX - chipW / 2, centerY - chipH / 2, chipW, chipH, 9, '#f1f5f9', '#cbd5e1', 1);
                    ctx.save();
                    ctx.strokeStyle = '#475569';
                    ctx.lineWidth = 2.4;
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                    ctx.beginPath();
                    ctx.moveTo(centerX + 8, centerY);
                    ctx.lineTo(centerX - 8, centerY);
                    ctx.moveTo(centerX - 2, centerY - 6);
                    ctx.lineTo(centerX - 8, centerY);
                    ctx.lineTo(centerX - 2, centerY + 6);
                    ctx.stroke();
                    ctx.restore();
                }

                createNewPage();

                // ۱. سربرگ فاکتور
                const headerH = 126;
                drawRoundRect(ctx, LEFT_X, cursorY, CONTENT_W, headerH, 22, '#f8fafc', '#e2e8f0', 1.8);
                drawRoundRect(ctx, RIGHT_X - 10, cursorY + 22, 6, headerH - 44, 3, '#4f46e5', null);

                // نشان برند در سمت چپ سربرگ
                setFont(800, 22);
                const brandText = 'دونگمون';

                drawRoundRect(ctx, LEFT_X + 26, cursorY + 22, brandPillW, 42, 12, '#4f46e5', null);
                ctx.fillStyle = '#ffffff';

                ctx.fillText(brandText, LEFT_X + 26 + brandPillW / 2, cursorY + 44);

                // تیتر اصلی هوشمند (نام رویداد یا عنوان پیش‌فرض)
                let headerInnerY = cursorY + 42;
                setFont(800, 32);
                ctx.fillStyle = '#0f172a';
                ctx.textAlign = 'right';
                const maxTitleW = CONTENT_W - brandPillW - 85;
                let mainTitle = cleanOutingTitle || 'جمع‌بندی خرج و مخارج';
                if (ctx.measureText(mainTitle).width > maxTitleW) {
                    while (mainTitle.length > 5 && ctx.measureText(mainTitle + '…').width > maxTitleW) {
                        mainTitle = mainTitle.slice(0, -1);
                    }
                    mainTitle += '…';

                ctx.fillText(mainTitle, RIGHT_X - 30, headerInnerY);

                headerInnerY += 46;
                setFont(500, 20);
                ctx.fillStyle = '#64748b';
                ctx.textAlign = 'right';
                const metaLine = todayPersian

                        if (!person.hasItemizedDetails) {

                                    ctx.fillStyle = '#475569';
                                    ctx.textAlign = 'right';
                                    ctx.fillText(`- ${item.title}`, RIGHT_X - 30, cursorY + 22);

                                    setFont(700, 19);
                                    ctx.fillStyle = '#0f172a';
                                    ctx.textAlign = 'left';
                                    ctx.fillText(`${formatCurrency(item.amount)} تومان`, LEFT_X + 30, cursorY + 22);
                                    cursorY += 48;
                                });
                                cursorY += 10;
                            }
                        }
                    });

                    if (nonSpenders.length > 0) {
                        setFont(600, 20);
                        const namesStr = `افراد بدون هزینه (۰ تومان): ${nonSpenders.map(p => p.name).join('، ')}`;
                        const wrapped = wrapCanvasText(ctx, namesStr, CONTENT_W - 48);
                        const nsBoxH = 26 + wrapped.length * 34;
                        ensureSpace(nsBoxH + 14);
                        drawRoundRect(ctx, LEFT_X, cursorY, CONTENT_W, nsBoxH, 15, '#f8fafc', '#e2e8f0', 1.4);

                cursorY += 18;

                ensureSpace(136);
                drawRoundRect(ctx, LEFT_X, cursorY, CONTENT_W, 122, 18, '#eef2ff', '#c7d2fe', 1.6);

                ctx.fillStyle = '#0f172a';
                ctx.textAlign = 'left';
                ctx.fillText(`${formatCurrency(totalExpense)} تومان`, LEFT_X + 26, cursorY + 38);

                ctx.beginPath();
                ctx.strokeStyle = '#c7d2fe';

                ctx.moveTo(LEFT_X + 24, cursorY + 62);
                ctx.lineTo(RIGHT_X - 24, cursorY + 62);

                ctx.fillStyle = '#475569';

                        drawRoundRect(ctx, x, y, w, rowH, 14, bgFill, borderCol, 1.4);

                                ctx.textAlign = 'right';
                                ctx.fillText(`${payer} (پرداخت به ${toPersianDigits(list.length)} نفر)`, RIGHT_X - 24, cursorY + 32);
                                setFont(700, 20);
                                ctx.fillStyle = '#e11d48';
                                ctx.textAlign = 'left';
                                ctx.fillText(`مجموع بدهی: ${formatCurrency(totalDebt)} تومان`, LEFT_X + 24, cursorY + 32);
                                cursorY += 72;

                                list.forEach(t => {
                                    ensureSpace(78);
                                    drawTransferCard(t, LEFT_X + 14, cursorY, CONTENT_W - 28, '#ffffff', '#fde68a');
                                    cursorY += 78;
                                });
                                cursorY += 10;
                            }
                        }
                    });
                }

                // ۵. پاورقی صفحات
                const totalPages = pages.length;
                pages.forEach((p, idx) => {
                    const pCtx = p.ctx;
                    const footerLineY = PAGE_H - 78;
                    pCtx.beginPath();
                    pCtx.strokeStyle = '#e2e8f0';
                    pCtx.lineWidth = 1.2;
                    pCtx.moveTo(LEFT_X, footerLineY);
                    pCtx.lineTo(RIGHT_X, footerLineY);
                    pCtx.stroke();

                    pCtx.font = `500 18px ${FONT_FAMILY}`;
                    pCtx.direction = 'rtl';
                    pCtx.textBaseline = 'middle';
                    pCtx.fillStyle = '#94a3b8';

                    pCtx.textAlign = 'right';
                    pCtx.fillText('دونگمون | تقسیم هوشمند هزینه‌های گروهی', RIGHT_X, PAGE_H - 46);

                    pCtx.textAlign = 'left';
                    pCtx.fillText(`صفحه ${toPersianDigits(idx + 1)} از ${toPersianDigits(totalPages)}`, LEFT_X, PAGE_H - 46);
                });

                return pages.map(p => p.canvas);
            }

            function dataUrlToUint8Array(dataUrl) {
                const base64 = dataUrl.split(',')[1];
                const binary = atob(base64);
                const bytes = new Uint8Array(binary.length);
                for (let i = 0; i < binary.length; i++) {
                    bytes[i] = binary.charCodeAt(i);
                }
                return bytes;
            }

            function asciiToBytes(str) {
                const bytes = new Uint8Array(str.length);
                for (let i = 0; i < str.length; i++) {
                    bytes[i] = str.charCodeAt(i) & 0xff;
                }
                return bytes;
            }

            function canvasesToPdfBytes(canvases) {
                const PW = 595.28;
                const PH = 841.89;
                const pageCount = canvases.length;
                const totalObjs = 3 + pageCount * 3;
                const offsets = new Array(totalObjs).fill(0);
                const chunks = [];
                let byteOffset = 0;

                function pushBytes(arr) {
                    chunks.push(arr);
                    byteOffset += arr.length;
                }

                function pushAscii(str) {
                    pushBytes(asciiToBytes(str));
                }

                // هدر استاندارد PDF 1.4 با بایت‌های باینری
                pushBytes(new Uint8Array([0x25, 0x50, 0x44, 0x46, 0x2d, 0x31, 0x2e, 0x34, 0x0a, 0x25, 0xff, 0xff, 0xff, 0xff, 0x0a]));

                // شیء ۱: Catalog
                offsets[1] = byteOffset;
                pushAscii('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');

                // شیء ۲: Pages
                const kidsRefs = [];
                for (let p = 0; p < pageCount; p++) {
                    kidsRefs.push(`${3 + p * 3} 0 R`);
                }
                offsets[2] = byteOffset;
                pushAscii(`2 0 obj\n<< /Type /Pages /Kids [${kidsRefs.join(' ')}] /Count ${pageCount} >>\nendobj\n`);

                // اشیاء هر صفحه (Page + Content + JPEG XObject)
                for (let p = 0; p < pageCount; p++) {
                    const canvas = canvases[p];
                    const jpegBytes = dataUrlToUint8Array(canvas.toDataURL('image/jpeg', 0.92));

                    const pageObjId = 3 + p * 3;
                    const contentObjId = 4 + p * 3;
                    const imageObjId = 5 + p * 3;

                    offsets[pageObjId] = byteOffset;
                    pushAscii(
                        `${pageObjId} 0 obj\n` +
                        `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /XObject << /Im0 ${imageObjId} 0 R >> >> /Contents ${contentObjId} 0 R >>\n` +
                        `endobj\n`
                    );

                    const contentStream = `q\n${PW} 0 0 ${PH} 0 0 cm\n/Im0 Do\nQ\n`;
                    offsets[contentObjId] = byteOffset;
                    pushAscii(
                        `${contentObjId} 0 obj\n` +
                        `<< /Length ${contentStream.length} >>\n` +
                        `stream\n${contentStream}\nendstream\n` +
                        `endobj\n`
                    );

                    offsets[imageObjId] = byteOffset;
                    pushAscii(
                        `${imageObjId} 0 obj\n` +
                        `<< /Type /XObject /Subtype /Image /Width ${canvas.width} /Height ${canvas.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpegBytes.length} >>\n` +
                        `stream\n`
                    );
                    pushBytes(jpegBytes);
                    pushAscii('\nendstream\nendobj\n');
                }

                // جدول xref (هر ردیف دقیقاً ۲۰ بایت طبق استاندارد PDF)
                const xrefStart = byteOffset;
                let xrefStr = `xref\n0 ${totalObjs}\n0000000000 65535 f \n`;
                for (let id = 1; id < totalObjs; id++) {
                    xrefStr += `${String(offsets[id]).padStart(10, '0')} 00000 n \n`;
                }
                pushAscii(xrefStr);

                pushAscii(
                    `trailer\n` +
                    `<< /Size ${totalObjs} /Root 1 0 R >>\n` +
                    `startxref\n${xrefStart}\n%%EOF\n`
                );

                const result = new Uint8Array(byteOffset);
                let pos = 0;
                for (let i = 0; i < chunks.length; i++) {
                    result.set(chunks[i], pos);
                    pos += chunks[i].length;
                }
                return result;
            }

            async function downloadInvoicePdf(triggerBtn) {
                if (!lastInvoiceData) {
                    calculateDong(false);
                }
                if (!lastInvoiceData) return;

                try {
                    if (document.fonts && document.fonts.ready) {
                        await Promise.race([
                            document.fonts.ready,
                            new Promise(resolve => setTimeout(resolve, 800))
                        ]);
                    }

                    const canvases = renderInvoiceCanvases(lastInvoiceData);
                    const pdfBytes = canvasesToPdfBytes(canvases);
                    const blob = new Blob([pdfBytes], { type: 'application/pdf' });
                    const url = URL.createObjectURL(blob);

                    const rawTitle = lastInvoiceData.cleanOutingTitle
                        ? lastInvoiceData.cleanOutingTitle.replace(/[\\/:*?"<>|]+/g, '-').trim()
                        : '';
                    const dateSuffix = getPersianFileDate();
                    const baseName = rawTitle ? `دونگمون-${rawTitle}` : 'دونگمون-فاکتور';
                    const fileName = dateSuffix ? `${baseName}-${dateSuffix}.pdf` : `${baseName}.pdf`;

                    const link = document.createElement('a');
                    link.href = url;
                    link.download = fileName;
                    link.style.display = 'none';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);

                    setTimeout(() => URL.revokeObjectURL(url), 10000);

                    showToast('فایل PDF فاکتور دانلود شد!', 'success');
                    triggerCopyButtonFeedback(triggerBtn, 'دانلود شد');
                } catch (err) {
                    showToast('خطا در ساخت فایل PDF.', 'warning');
                }
            }

            function copyTextToClipboard(text, successMsg, triggerBtn) {
                if (!text) return;

                const onCopySuccess = () => {
                    showToast(successMsg, 'success');
                    triggerCopyButtonFeedback(triggerBtn);
                };

                const fallbackCopy = () => {
                    const textarea = document.createElement('textarea');
                    textarea.value = text;
                    textarea.style.position = 'fixed';
                    textarea.style.top = '-9999px';
                    textarea.style.opacity = '0';
                    document.body.appendChild(textarea);
                    textarea.focus();
                    textarea.select();

                    try {
                        const ok = document.execCommand('copy');
                        if (ok) {
                            onCopySuccess();
                        } else {
                            showToast('کپی انجام نشد.', 'warning');
                        }
                    } catch (err) {
                        showToast('مرورگر اجازه کپی خودکار نداد.', 'warning');
                    } finally {
                        document.body.removeChild(textarea);
                    }
                };

                if (navigator.clipboard && window.isSecureContext) {
                    navigator.clipboard.writeText(text)
                        .then(onCopySuccess)
                        .catch(() => fallbackCopy());
                } else {
                    fallbackCopy();
                }
            }

            // --- اتصال دکمه‌های ثابت صفحه ---

            document.getElementById('btn-theme-toggle').addEventListener('click', toggleTheme);
            document.getElementById('btn-sample').addEventListener('click', loadSampleData);
            document.getElementById('btn-reset').addEventListener('click', resetAll);
            document.getElementById('btn-add-person').addEventListener('click', addParticipant);
            document.getElementById('btn-calculate').addEventListener('click', () => calculateDong(true));
            document.getElementById('btn-copy-settlements').addEventListener('click', function () {
                copyTextToClipboard(lastGeneratedSettlementSummary, 'خلاصه تسویه‌حساب در حافظه کپی شد!', this);
            });
            document.getElementById('btn-copy-invoice').addEventListener('click', function () {
                copyTextToClipboard(lastGeneratedFullReport, 'فاکتور کامل در حافظه کپی شد!', this);
            });
            document.getElementById('btn-download-pdf').addEventListener('click', function () {
                downloadInvoicePdf(this);
            });

            // شروع اولیه برنامه
            initTheme();
            renderParticipants();
        })();
    </script>
